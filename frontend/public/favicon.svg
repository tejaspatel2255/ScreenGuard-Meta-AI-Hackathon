<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Shell -->
  <path d="M 50 8 
           C 72 8, 88 18, 88 36 
           C 88 64, 68 85, 50 92 
           C 32 85, 12 64, 12 36 
           C 12 18, 28 8, 50 8 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="3" 
        filter="url(#neonGlow)" />

  <!-- Inner Digital Display Screen Mesh -->
  <rect x="25" y="24" width="50" height="34" rx="4" 
        fill="#090d16" 
        stroke="rgba(56, 189, 248, 0.4)" 
        stroke-width="1.5" />

  <!-- Screen Scanline Grid / Standby Dot -->
  <circle cx="31" cy="30" r="1.5" fill="#ef4444" />
  <circle cx="36" cy="30" r="1.5" fill="#f59e0b" />
  <circle cx="41" cy="30" r="1.5" fill="#10b981" />

  <!-- Central AI Vision Iris (Supervisor Eye) -->
  <ellipse cx="50" cy="41" rx="15" ry="9" 
           fill="none" 
           stroke="url(#eyeGrad)" 
           stroke-width="2.2" />

  <!-- Iris Center Aperture -->
  <circle cx="50" cy="41" r="5" 
          fill="#38bdf8" />

  <!-- Reticle Crosshair Pulse -->
  <circle cx="50" cy="41" r="2" fill="#ffffff" />
  <line x1="50" y1="28" x2="50" y2="30" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="52" x2="50" y2="54" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="41" x2="34" y2="41" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="66" y1="41" x2="68" y2="41" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Verification Check Mark Guard Banner -->
  <path d="M 38 68 L 47 77 L 64 59" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />
</svg>
